name: نشر صفحة الهبوط على صفحات GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
      
      - name: تجهيز الملفات للنشر
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APSHER FOLDER ==="
          ls -la Apsher/ | head -30
          mkdir -p _site_publish
          cp -r Apsher/* _site_publish/
          echo "=== READY TO PUBLISH ==="
          ls -la _site_publish/ | head -30
      
      - name: رفع ملفات الموقع الجاهز
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_publish
          
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4

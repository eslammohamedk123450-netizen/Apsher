name: نشر صفحة الهبوط على صفحات GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
      
      - name: تثبيت Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: تثبيت الحزم وبناء المشروع
        run: |
          ls -la
          if [ -f "package.json" ]; then
            npm install
            npm run build
          else
            cd Apsher
            npm install
            npm run build
            cd ..
            mkdir -p dist
            cp -r Apsher/dist/* dist/ || cp -r Apsher/build/* dist/ || cp -r Apsher/* dist/
          fi
          
      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and prepare site
        run: |
          echo "== اين هو index.html =="
          find . -name "index.html" | grep -v ".git"
          mkdir -p out
          # دور على اول index.html وانشر الفولدر بتاعه
          FILE=$(find . -type f -name "index.html" ! -path "./.github/*" ! -path "./out/*" | head -1)
          echo "Found: $FILE"
          FOLDER=$(dirname "$FILE")
          echo "Folder: $FOLDER"
          cp -r "$FOLDER"/. out/
          echo "== محتوى out =="
          ls -la out/
          # لازم يكون فيه index.html في out
          ls out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4

name: نشر صفحة الهبوط على صفحات GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
      
      - name: رفع ملفات الموقع الجاهز
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Apsher
          
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4

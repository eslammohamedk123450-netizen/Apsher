name: نشر صفحة الهبوط على صفحات GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4
      
      - name: تثبيت Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: كشف مكان المشروع وبنائه
        run: |
          if [ -f "site/package.json" ]; then
            cd site
            npm install
            npm run build
            cd ..
          elif [ -f "package.json" ]; then
            npm install
            npm run build
          else
            PKG=$(find . -name "package.json" | head -1)
            DIR=$(dirname "$PKG")
            echo "Building in $DIR"
            cd "$DIR"
            npm install
            npm run build
            cd $GITHUB_WORKSPACE
          fi
          echo "=== فين الـ dist ==="
          find . -type d -name "dist" | head -10
          ls -la site/dist/ 2>/dev/null || true
          ls -la dist/ 2>/dev/null || true
          
      - name: تجهيز مجلد النشر
        run: |
          mkdir -p ./dist_final
          if [ -d "site/dist" ]; then
            cp -r site/dist/* ./dist_final/
          elif [ -d "dist" ]; then
            cp -r dist/* ./dist_final/
          else
            D=$(find . -type d -name dist | head -1)
            cp -r $D/* ./dist_final/ || true
          fi
          ls -la ./dist_final/ | head -20
          
      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist_final
          
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4

name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Enable Multidex
        run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text()
          # 1. حطه جوه defaultConfig فقط، مش في اي minSdkVersion تاني
          if "multiDexEnabled" not in t:
              t = re.sub(
                  r"(defaultConfig\s*\{)",
                  r"\1\n        multiDexEnabled true",
                  t,
                  count=1
              )
          # 2. ضيف المكتبة
          if "androidx.multidex" not in t:
              t = t.replace("dependencies {", "dependencies {\n    implementation 'androidx.multidex:multidex:2.0.1'", 1)
          p.write_text(t)
          print("Multidex fixed inside defaultConfig")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
